// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const SUPABASE_URL = window.SUPABASE_URL || "";
const SUPABASE_KEY = window.SUPABASE_ANON_KEY || "";
async function sbFetch(path, opts = {}) {
  if (!SUPABASE_URL || !SUPABASE_KEY) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...opts,
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": opts.method === "POST" ? "return=minimal" : "return=representation",
        ...(opts.headers || {})
      }
    });
    if (!res.ok) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch {
    return null;
  }
}
async function loadFromSupabase(userId) {
  const rows = await sbFetch(`training_data?user_id=eq.${encodeURIComponent(userId)}&select=key,value`);
  if (!rows || !Array.isArray(rows)) return null;
  const result = {};
  for (const r of rows) {
    try {
      result[r.key] = JSON.parse(r.value);
    } catch {
      result[r.key] = r.value;
    }
  }
  return result;
}
async function saveToSupabase(userId, key, value) {
  if (!SUPABASE_URL || !SUPABASE_KEY) return;
  await sbFetch(`training_data`, {
    method: "POST",
    headers: {
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify({
      user_id: userId,
      key,
      value: JSON.stringify(value),
      updated_at: new Date().toISOString()
    })
  });
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function formatDate(str) {
  if (!str) return "";
  const d = new Date(str + "T00:00:00");
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function dayOfWeek(str) {
  return new Date(str + "T00:00:00").getDay();
}
function daysUntil(str) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((new Date(str + "T00:00:00") - t) / 86400000);
}
function typeLabel(type) {
  return type === "intervals" ? "🏃 Intervaller" : type === "easy" ? "🌿 Rolig jogging" : type === "long" ? "🏔️ Langtur" : type === "bike" ? "🚴 Sykkel" : type === "strength" ? "💪 Styrke" : "😴 Hvile";
}
function intensityColor(i) {
  return i === "hard" ? C.red : i === "medium" ? C.yellow : i === "easy" ? C.green : C.muted;
}

// ─── PERIODIZATION ENGINE ────────────────────────────────────────────────────
function fmtPace(m) {
  if (!m || isNaN(m)) return null;
  return `${Math.floor(m)}:${String(Math.round(m % 1 * 60)).padStart(2, "0")}`;
}
function parseTargetPace(goal) {
  if (!goal.targetTime || !goal.distanceKm) return null;
  const parts = goal.targetTime.split(":").map(Number);
  const totalMin = parts.length === 3 ? parts[0] * 60 + parts[1] + parts[2] / 60 : parts[0] + parts[1] / 60;
  return totalMin / parseFloat(goal.distanceKm);
}

// Returns which week number we are counting DOWN from a race date
// Week 0 = race week, week 1 = one week before, etc.
function weeksUntil(dateStr) {
  return Math.floor(daysUntil(dateStr) / 7);
}

// Bølgeperiodisering: returns load factor 0.6–1.0 based on week in cycle
// Pattern: build, build, build, recover (repeat)
function weekLoadFactor(weeksOut) {
  const cyclePos = weeksOut % 4; // 0=race/recover, 1=hard, 2=harder, 3=hardest
  return [0.65, 0.80, 0.90, 1.0][cyclePos] ?? 0.85;
}
function getGoalSuggestions(goals, profile, dow, dateStr) {
  if (!goals || goals.length === 0) return DEFAULT_WEEKLY[dow] || [];
  const targetDate = dateStr || todayStr();
  const maxHr = parseFloat(profile?.maxHr) || 185;
  const z1 = {
    lo: Math.round(maxHr * 0.50),
    hi: Math.round(maxHr * 0.60)
  };
  const z2 = {
    lo: Math.round(maxHr * 0.60),
    hi: Math.round(maxHr * 0.70)
  };
  const z3 = {
    lo: Math.round(maxHr * 0.70),
    hi: Math.round(maxHr * 0.80)
  };
  const z4 = {
    lo: Math.round(maxHr * 0.80),
    hi: Math.round(maxHr * 0.90)
  };
  const z5 = {
    lo: Math.round(maxHr * 0.90),
    hi: maxHr
  };

  // Sort goals by date ascending – nearest first
  const sorted = [...goals].sort((a, b) => a.date.localeCompare(b.date));
  // Find the most relevant goal: nearest upcoming race
  const primary = sorted.find(g => daysUntil(g.date) > -7) || sorted[0];
  const secondary = sorted.find(g => g.id !== primary.id && daysUntil(g.date) > daysUntil(primary.date));
  const daysLeft = daysUntil(primary.date);
  const weeksLeft = weeksUntil(primary.date);
  const dist = parseFloat(primary.distanceKm) || 21.1;
  const isMarathon = dist >= 40;
  const isHalf = dist >= 19 && dist < 40;
  const is10k = dist >= 8 && dist < 19;
  const racePace = parseTargetPace(primary);
  const threshPace = racePace ? fmtPace(racePace * (isMarathon ? 0.98 : 1.03)) : null;
  const easyPace = racePace ? fmtPace(racePace * 1.20) : null;
  const longPace = racePace ? fmtPace(racePace * (isMarathon ? 1.12 : 1.15)) : null;
  const racePaceStr = racePace ? fmtPace(racePace) : null;
  const load = weekLoadFactor(weeksLeft);

  // Determine phase
  let phase;
  if (daysLeft <= 0) phase = "done";else if (daysLeft <= 7) phase = "raceweek";else if (daysLeft <= 21) phase = "taper";else if (daysLeft <= 56) phase = "peak";else phase = "build";

  // Progressive long run distance
  // Base: for build phase, scale with weeks remaining + load factor
  // Marathon: peak long run ~32–35 km, half: ~22–24 km, 10k: ~16 km
  const peakLong = isMarathon ? 33 : isHalf ? 23 : 16;
  const progressFactor = phase === "build" ? Math.min(load, 0.95) : phase === "peak" ? weeksLeft <= 4 ? 1.0 : load : 0.6;
  const longRunKm = Math.round(peakLong * progressFactor);

  // Progressive interval sessions – rotate through 4 different workouts by week
  const intervalRotation = weeksLeft % 4;
  function intervalSession1() {
    // Long threshold – builds aerobic capacity
    const reps = isMarathon ? 4 : is10k ? 6 : 5;
    const dur = isMarathon ? 10 : is10k ? 6 : 8;
    return {
      type: "intervals",
      intensity: "hard",
      label: "🏃 Langt terskel",
      desc: `${reps}×${dur} min terskel${threshPace ? ` · ${threshPace}/km` : ""} · Puls: ${z4.lo}–${z4.hi} · 2 min pause`
    };
  }
  function intervalSession2() {
    // Medium tempo intervals
    const reps = isMarathon ? 3 : is10k ? 8 : 5;
    const dist2 = isMarathon ? "2 km" : is10k ? "1 km" : "1.5 km";
    return {
      type: "intervals",
      intensity: "hard",
      label: "🏃 Tempodrager",
      desc: `${reps}×${dist2} race-tempo${racePaceStr ? ` · ${racePaceStr}/km` : ""} · Puls: ${z4.lo}–${z4.hi} · 90 sek pause`
    };
  }
  function intervalSession3() {
    // Short sharp – speed/economy
    const reps = isMarathon ? 8 : is10k ? 12 : 10;
    return {
      type: "intervals",
      intensity: "hard",
      label: "🏃 Kortintervaller",
      desc: `${reps}×400 m rask${racePace ? ` (~${fmtPace(racePace * 0.93)}/km)` : ""} · Puls: ${z4.hi}–${z5.hi} · 90 sek pause`
    };
  }
  function intervalSession4() {
    // Norwegian double threshold style
    const reps = isMarathon ? 6 : is10k ? 8 : 7;
    return {
      type: "intervals",
      intensity: "hard",
      label: "🏃 Dobbel terskel",
      desc: `${reps}×5 min terskel${threshPace ? ` · ${threshPace}/km` : ""} · Puls: ${z3.hi}–${z4.hi} · 1 min pause – norsk metode`
    };
  }
  const intSessions = [intervalSession1, intervalSession2, intervalSession3, intervalSession4];
  const mon_interval = intSessions[intervalRotation]();
  const thu_interval = intSessions[(intervalRotation + 2) % 4](); // different session Thursday

  // Secondary goal note
  const secondaryNote = secondary ? ` · Grunnlag for ${secondary.name} (${daysUntil(secondary.date)} dager)` : "";
  if (phase === "done") return DEFAULT_WEEKLY[dow] || [];
  if (phase === "raceweek") {
    const sessions = {
      1: [{
        type: "easy",
        label: "🌿 Lett jogging",
        desc: `20 min aktivering${easyPace ? ` · ${easyPace}/km` : ""}`,
        intensity: "easy"
      }],
      2: [{
        type: "intervals",
        label: "🏃 Aktivering",
        desc: `4×200 m strides · Puls: ${z3.lo}–${z4.lo} · Behold spensten`,
        intensity: "hard"
      }],
      3: [{
        type: "rest",
        label: "😴 Hvile",
        desc: "Full hvile – kroppen lader",
        intensity: "rest"
      }],
      4: [{
        type: "easy",
        label: "🌿 Kort jogg",
        desc: `15–20 min rolig + 4×100 m strides · Puls maks ${z2.hi}`,
        intensity: "easy"
      }],
      5: [{
        type: "rest",
        label: "😴 Hvile",
        desc: "Legg frem utstyr, spis karbo, sov tidlig",
        intensity: "rest"
      }],
      6: [{
        type: "intervals",
        label: `🏆 ${primary.name}!`,
        desc: `Løpsdag! Mål: ${primary.targetTime || ""}${racePaceStr ? ` · ${racePaceStr}/km` : ""}`,
        intensity: "hard"
      }],
      0: []
    };
    return sessions[dow] || [];
  }
  if (phase === "taper") {
    const tapLoad = weeksLeft <= 1 ? 0.5 : 0.7;
    const tapLong = Math.round(longRunKm * tapLoad);
    const sessions = {
      1: [{
        type: "intervals",
        label: "🏃 Kort terskel",
        desc: `3×8 min terskel${threshPace ? ` · ${threshPace}/km` : ""} · Puls: ${z4.lo}–${z4.hi} · Vedlikehold form`,
        intensity: "hard"
      }],
      2: [{
        type: "easy",
        label: "🌿 Rolig jogging",
        desc: `30–40 min${easyPace ? ` · ${easyPace}/km` : ""} · Puls: ${z1.hi}–${z2.hi}`,
        intensity: "easy"
      }],
      3: [{
        type: "strength",
        label: "💪 Lett styrke",
        desc: "Vedlikehold, halvparten av normal vekt",
        intensity: "easy"
      }],
      4: [{
        type: "easy",
        label: "🌿 Rolig jogging",
        desc: `25–35 min${easyPace ? ` · ${easyPace}/km` : ""} · Puls maks ${z2.hi}`,
        intensity: "easy"
      }],
      5: [{
        type: "bike",
        label: "🚴 Lett sykkel / Fri",
        desc: "Aktiv restitusjon eller hvile",
        intensity: "easy"
      }],
      6: [{
        type: "long",
        label: "🏔️ Kortere langtur",
        desc: `${tapLong} km rolig${longPace ? ` · ${longPace}/km` : ""} · Puls: ${z2.lo}–${z2.hi}`,
        intensity: "medium"
      }],
      0: []
    };
    return sessions[dow] || [];
  }
  if (phase === "peak") {
    const sessions = {
      1: [mon_interval],
      2: [{
        type: "strength",
        label: "💪 Styrke",
        desc: "Knebøy, markløft, dips, pull-ups – full styrke",
        intensity: "easy"
      }],
      3: [{
        type: "easy",
        label: "🌿 Rolig jogging",
        desc: `50–60 min${easyPace ? ` · ${easyPace}/km` : ""} · Puls: ${z2.lo}–${z2.hi} – restitusjon`,
        intensity: "easy"
      }],
      4: [thu_interval],
      5: [{
        type: "bike",
        label: "🚴 Rolig sykkel",
        desc: `Aktiv restitusjon · Puls maks ${z2.hi}`,
        intensity: "easy"
      }],
      6: [{
        type: "long",
        label: "🏔️ Langtur",
        desc: `${longRunKm} km${longPace ? ` · ${longPace}/km` : ""} · Puls: ${z2.lo}–${z3.lo}${secondaryNote}`,
        intensity: "medium"
      }],
      0: []
    };
    return sessions[dow] || [];
  }

  // BUILD PHASE
  const buildSessions = {
    1: [mon_interval],
    2: [{
      type: "strength",
      label: "💪 Styrke + alternativ",
      desc: "Knebøy, markløft, dips, pull-ups + evt. svømming/sykkel",
      intensity: "easy"
    }],
    3: [{
      type: "easy",
      label: "🌿 Rolig jogging",
      desc: `45–55 min${easyPace ? ` · ${easyPace}/km` : ""} · Puls: ${z1.hi}–${z2.hi} – snakketempo`,
      intensity: "easy"
    }],
    4: [thu_interval],
    5: [{
      type: "bike",
      label: "🚴 Sykkel / Fri",
      desc: `Lett sykkel eller hvile · Puls maks ${z2.hi}`,

    }],
    6: [{
      type: "long",
      label: "🏔️ Langtur",
      desc: `${longRunKm} km rolig${longPace ? ` · ${longPace}/km` : ""} · Puls: ${z1.hi}–${z2.hi}${secondaryNote}`,
      intensity: "medium"
    }],
    0: []
  };
  return buildSessions[dow] || [];
}

// ─── ANALYSIS ────────────────────────────────────────────────────────────────
function analyzeDashboard({
  hr,
  hrv,
  sleep,
  feel,
  sessions,
  goals,
  todayType,
  profile
}) {
  const tips = [],
    warnings = [];
  const normHrv = parseFloat(profile?.normHrv) || 65;
  const normHr = parseFloat(profile?.normHr) || 50;
  if (hrv) {
    const h = parseFloat(hrv),
      diff = (h - normHrv) / normHrv * 100;
    if (diff < -15) warnings.push(`⚠️ HRV ${h}ms er ${Math.abs(diff.toFixed(0))}% under din norm (${normHrv}ms). Vurder hvile eller lett økt.`);else if (diff > 15) tips.push(`✅ HRV ${h}ms over din norm – grønt lys for hard økt!`);else tips.push(`🟡 HRV normal (${h}ms). Gjennomfør planlagt økt.`);
  }
  if (hr) {
    const diff = parseFloat(hr) - normHr;
    if (diff > 7) warnings.push(`🔴 Hvilepuls ${hr} bpm er ${diff.toFixed(0)} over din norm. Mulig overtrening eller sykdom.`);else if (diff < -5) tips.push(`💚 Lav hvilepuls (${hr} bpm) – god aerob form.`);
  }
  if (sleep) {
    const s = parseFloat(sleep);
    if (s < 6) warnings.push("😴 Under 6t søvn nullstiller treningsgevinsten. Ta det rolig i dag.");else if (s >= 8) tips.push("🌙 God søvn – restitusjonen er optimal.");
  }
  if (feel) {
    const f = parseInt(feel);
    if (f <= 2) warnings.push("😕 Lav dagsform – bytt til lett alternativ i dag.");else if (f === 5) tips.push("🔥 Toppform – utnytt det!");
  }
  const now = new Date();
  const last7 = sessions.filter(s => (now - new Date(s.date + "T00:00:00")) / 86400000 <= 7);
  const hard = last7.filter(s => s.type === "intervals");
  const km = last7.reduce((a, s) => a + (parseFloat(s.km) || 0), 0);
  if (hard.length >= 3) warnings.push(`🚨 ${hard.length} harde økter siste 7 dager – over anbefalt max (2).`);
  if (km > 0) tips.push(`📊 ${km.toFixed(0)} km denne uken.`);
  if (goals.length > 0) {
    const g = goals[0],
      days = daysUntil(g.date);
    if (days > 0 && days < 14) tips.push(`🎯 ${days} dager til ${g.name}! Tapering: -40% volum, behold intensitet.`);else if (days > 0 && days < 30) tips.push(`🎯 ${days} dager til ${g.name}. Fokus på kvalitetsøkter og søvn.`);
  }
  if (!warnings.length && !tips.length) return ["Legg inn morgendata for personlige anbefalinger."];
  return [...warnings, ...tips];
}

// ─── STORE HOOK ───────────────────────────────────────────────────────────────
function useStore(key, init) {
  const [val, setValRaw] = React.useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch {
      return init;
    }
  });
  const pendingRef = React.useRef(null);
  const setVal = React.useCallback((v, userId) => {
    setValRaw(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try {
        localStorage.setItem(key, JSON.stringify(next));
      } catch {}
      if (userId) {
        clearTimeout(pendingRef.current);
        pendingRef.current = setTimeout(() => saveToSupabase(userId, key, next), 1500);
      }
      return next;
    });
  }, [key]);
  return [val, setVal];
}
