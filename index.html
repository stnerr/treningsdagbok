function sbUrl() {
  return window.SUPABASE_URL || "";
}
function sbKey() {
  return window.SUPABASE_ANON_KEY || "";
}
async function sbFetch(path, opts = {}) {
  const url = sbUrl(),
    key = sbKey();
  if (!url || !key) return null;
  try {
    const res = await fetch(`${url}/rest/v1/${path}`, {
      ...opts,
      headers: {
        "apikey": key,
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json",
        "Prefer": opts.prefer || "return=representation",
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      console.warn("SB", res.status, await res.text());
      return null;
    }
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  } catch (e) {
    console.warn("SB err", e);
    return null;
  }
}
async function loadFromSupabase(uid) {
  if (!sbUrl() || !sbKey() || !uid) return null;
  const rows = await sbFetch(`training_data?user_id=eq.${encodeURIComponent(uid)}&select=key,value`);
  if (!rows || !Array.isArray(rows)) return null;
  const r = {};
  for (const row of rows) {
    try {
      r[row.key] = JSON.parse(row.value);
    } catch {
      r[row.key] = row.value;
    }
  }
  return r;
}
async function saveToSupabase(uid, key, value) {
  if (!sbUrl() || !sbKey() || !uid) return;
  await sbFetch(`training_data`, {
    method: "POST",
    prefer: "resolution=merge-duplicates",
    body: JSON.stringify({
      user_id: uid,
      key,
      value: JSON.stringify(value),
      updated_at: new Date().toISOString()
    })
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function formatDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function formatDateShort(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return `${d.getDate()}. ${MONTHS[d.getMonth()].slice(0, 3)}`;
}
function dow(s) {
  return new Date(s + "T00:00:00").getDay();
}
// Monday=0 index for calendar grid
function dowMon(s) {
  const d = dow(s);
  return d === 0 ? 6 : d - 1;
}
function daysUntil(s) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((new Date(s + "T00:00:00") - t) / 86400000);
}

function fmtPace(m) {
  if (!m || isNaN(m)) return null;
  return `${Math.floor(m)}:${String(Math.round(m % 1 * 60)).padStart(2, "0")}`;
}
function parsePace(s) {
  if (!s) return null;
  const p = s.split(":");
  if (p.length === 2) return parseInt(p[0]) + parseInt(p[1]) / 60;
  return null;
}
function calcPace(km, min) {
  if (!km || !min || parseFloat(km) === 0) return "";
  const p = parseFloat(min) / parseFloat(km);
  return fmtPace(p) || "";
}
// GAP: grade-adjusted pace (~3.3% per 1% grade)
function calcGAP(pace, elevM, distKm) {
  if (!pace || !elevM || !distKm) return null;
  const grade = parseFloat(elevM) / parseFloat(distKm) / 10;
  const factor = 1 - grade * 0.033;
  const adj = parsePace(pace) * factor;
  return adj > 0 ? fmtPace(adj) : null;
}
// HAP: heat-adjusted pace (~5 sec/km per degree above 15°C)
function calcHAP(pace, tempC) {
  if (!pace || !tempC) return null;
  const excess = Math.max(0, parseFloat(tempC) - 15);
  const adj = parsePace(pace) - excess * 0.083;
  return adj > 0 ? fmtPace(adj) : null;
}
// Grade percent from elevation gain and distance
function calcGradePercent(elevM, distKm) {
  if (!elevM || !distKm || parseFloat(distKm) === 0) return null;
  return (parseFloat(elevM) / (parseFloat(distKm) * 1000) * 100).toFixed(1);
}
// Bike: km/h from km and minutes
function calcKmh(km, min) {
  if (!km || !min || parseFloat(min) === 0) return "";
  return (parseFloat(km) / (parseFloat(min) / 60)).toFixed(1);
}
// Bike: rough power estimate (watts) from speed, elevation gain, distance, rider+bike weight
// Simplified physics model: P = (Froll + Fgrav + Faero) * v
function calcBikeWatts(km, min, elevM, weightKg) {
  if (!km || !min || parseFloat(km) === 0 || parseFloat(min) === 0) return null;
  const distM = parseFloat(km) * 1000,
    timeS = parseFloat(min) * 60;
  const v = distM / timeS; // m/s
  const mass = (parseFloat(weightKg) || 75) + 9; // rider + bike estimate
  const grade = elevM ? parseFloat(elevM) / distM : 0;
  const g = 9.81,
    Crr = 0.005,
    CdA = 0.32,
    rho = 1.225;
  const Froll = Crr * mass * g;
  const Fgrav = mass * g * grade;
  const Faero = 0.5 * rho * CdA * v * v;
  const watts = (Froll + Fgrav + Faero) * v;
  return watts > 0 ? Math.round(watts) : null;
}
// Swim: pace in min/100m from km (or m) and minutes
function calcSwimPace(distM, min) {
  if (!distM || !min || parseFloat(distM) === 0) return "";
  const pace100 = parseFloat(min) / (parseFloat(distM) / 100);
  return fmtPace(pace100) || "";
}

// ─── ICS CALENDAR EXPORT ────────────────────────────────────────────────────
function icsEscape(s) {
  return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}
function icsDate(dateStr) {
  return dateStr.replace(/-/g, "");
}
function generateICS(prefs, goals, profile, plannedSessions, daysAhead) {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Treningsdagbok//NO", "CALSCALE:GREGORIAN"];
  const start = todayStr();
  for (let i = 0; i < daysAhead; i++) {
    const date = addDays(start, i);
    const plans = getPlannedSessionsForDate(prefs, goals, profile, plannedSessions, date);
    plans.forEach((p, idx) => {
      if (!p.type || p.type === "rest") return;
      const dateNoD = icsDate(date);
      const uid = `${dateNoD}-${idx}-${p.type}@treningsdagbok`;
      lines.push("BEGIN:VEVENT");
      lines.push(`UID:${uid}`);
      lines.push(`DTSTAMP:${dateNoD}T000000Z`);
      lines.push(`DTSTART;VALUE=DATE:${dateNoD}`);
      lines.push(`SUMMARY:${icsEscape(p.label.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF]/gu, "").trim())}`);
      lines.push(`DESCRIPTION:${icsEscape(p.desc)}`);
      lines.push("END:VEVENT");
    });
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(prefs, goals, profile, plannedSessions, daysAhead = 90) {
  const ics = generateICS(prefs, goals, profile, plannedSessions, daysAhead);
  const blob = new Blob([ics], {
    type: "text/calendar;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "treningsplan.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function useStore(key, init) {
  const [val, setValRaw] = React.useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch {
      return init;
    }
  });
  const pendRef = React.useRef(null);
  const setVal = React.useCallback((v, uid) => {
    setValRaw(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try {
        localStorage.setItem(key, JSON.stringify(next));
      } catch {}
      if (uid) {
        clearTimeout(pendRef.current);
        pendRef.current = setTimeout(() => saveToSupabase(uid, key, next), 1500);
      }
      return next;
    });
  }, [key]);
  return [val, setVal];
}
