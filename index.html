// ─── SUPABASE ─────────────────────────────────────────────────────────────────
function sbUrl() {
  return window.SUPABASE_URL || "";
}
function sbKey() {
  return window.SUPABASE_ANON_KEY || "";
}
async function sbFetch(path, opts = {}) {
  const url = sbUrl(),
    key = sbKey();
  if (!url || !key) return null;
  try {
    const res = await fetch(`${url}/rest/v1/${path}`, {
      ...opts,
      headers: {
        "apikey": key,
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json",
        "Prefer": opts.prefer || "return=representation",
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      console.warn("SB", res.status, await res.text());
      return null;
    }
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  } catch (e) {
    console.warn("SB err", e);
    return null;
  }
}
async function loadFromSupabase(uid) {
  if (!sbUrl() || !sbKey() || !uid) return null;
  const rows = await sbFetch(`training_data?user_id=eq.${encodeURIComponent(uid)}&select=key,value`);
  if (!rows || !Array.isArray(rows)) return null;
  const r = {};
  for (const row of rows) {
    try {
      r[row.key] = JSON.parse(row.value);
    } catch {
      r[row.key] = row.value;
    }
  }
  return r;
}
async function saveToSupabase(uid, key, value) {
  if (!sbUrl() || !sbKey() || !uid) return;
  await sbFetch(`training_data`, {
    method: "POST",
    prefer: "resolution=merge-duplicates",
    body: JSON.stringify({
      user_id: uid,
      key,
      value: JSON.stringify(value),
      updated_at: new Date().toISOString()
    })
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function formatDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function formatDateShort(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return `${d.getDate()}. ${MONTHS[d.getMonth()].slice(0, 3)}`;
}
function dow(s) {
  return new Date(s + "T00:00:00").getDay();
}
// Monday=0 index for calendar grid
function dowMon(s) {
  const d = dow(s);
  return d === 0 ? 6 : d - 1;
}
function daysUntil(s) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((new Date(s + "T00:00:00") - t) / 86400000);
}
function weeksUntil(s) {
  return Math.floor(daysUntil(s) / 7);
}
function addDays(s, n) {
  const d = new Date(s + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function fmtPace(m) {
  if (!m || isNaN(m)) return null;
  return `${Math.floor(m)}:${String(Math.round(m % 1 * 60)).padStart(2, "0")}`;
}
function parsePace(s) {
  if (!s) return null;
  const p = s.split(":");
  if (p.length === 2) return parseInt(p[0]) + parseInt(p[1]) / 60;
  return null;
}
function calcPace(km, min) {
  if (!km || !min || parseFloat(km) === 0) return "";
  const p = parseFloat(min) / parseFloat(km);
  return fmtPace(p) || "";
}
// GAP: grade-adjusted pace (~3.3% per 1% grade)
function calcGAP(pace, elevM, distKm) {
  if (!pace || !elevM || !distKm) return null;
  const grade = parseFloat(elevM) / parseFloat(distKm) / 10;
  const factor = 1 - grade * 0.033;
  const adj = parsePace(pace) * factor;
  return adj > 0 ? fmtPace(adj) : null;
}
// HAP: heat-adjusted pace (~5 sec/km per degree above 15°C)
function calcHAP(pace, tempC) {
  if (!pace || !tempC) return null;
  const excess = Math.max(0, parseFloat(tempC) - 15);
  const adj = parsePace(pace) - excess * 0.083;
  return adj > 0 ? fmtPace(adj) : null;
}

function useStore(key, init) {
  const [val, setValRaw] = React.useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch {
      return init;
    }
  });
  const pendRef = React.useRef(null);
  const setVal = React.useCallback((v, uid) => {
    setValRaw(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try {
        localStorage.setItem(key, JSON.stringify(next));
      } catch {}
      if (uid) {
        clearTimeout(pendRef.current);
        pendRef.current = setTimeout(() => saveToSupabase(uid, key, next), 1500);
      }
      return next;
    });
  }, [key]);
  return [val, setVal];
}

function getProgramSession(progKey, startDate, dateStr) {
  const prog = PROGRAMS[progKey];
  if (!prog || prog.isAuto || !startDate || !dateStr) return null;
  const daysDiff = Math.round((new Date(dateStr + "T00:00:00") - new Date(startDate + "T00:00:00")) / 86400000);
  if (daysDiff < 0) return null;
  const weekIdx = Math.floor(daysDiff / 7);
  if (weekIdx >= prog.weeks.length) return null;
  const weekPlan = prog.weeks[weekIdx];
  return weekPlan[dow(dateStr)] || [];
}
function getPlannedSessionsForDate(prefs, goals, profile, plannedSessions, dateStr) {
  if (plannedSessions[dateStr] !== undefined) return plannedSessions[dateStr];
  const prog = prefs?.program || "auto";
  if (prog !== "auto") {
    const result = getProgramSession(prog, prefs?.programStartDate, dateStr);
    if (result !== null) return result;
  }
  return getGoalSuggestions(goals, profile, prefs, dateStr);
}

// ─── PERIODIZATION ENGINE ─────────────────────────────────────────────────────
function parseTargetPace(goal) {
  if (!goal.targetTime || !goal.distanceKm) return null;
  const p = goal.targetTime.split(":").map(Number);
  const m = p.length === 3 ? p[0] * 60 + p[1] + p[2] / 60 : p[0] + p[1] / 60;
  return m / parseFloat(goal.distanceKm);
}
function weekLoadFactor(weeksOut) {
  // 4-week wave: build, build, peak, recover
  const pos = weeksOut % 4;
  return [0.65, 0.85, 1.0, 0.72][pos] ?? 0.85;
}

  const z3 = {
    lo: Math.round(maxHr * .70),
    hi: Math.round(maxHr * .80)
  };
  const z4 = {
    lo: Math.round(maxHr * .80),
    hi: Math.round(maxHr * .90)
