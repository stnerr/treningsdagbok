function sbUrl() {
  return window.SUPABASE_URL || "";
}
function sbKey() {
  return window.SUPABASE_ANON_KEY || "";
}
async function sbFetch(path, opts = {}) {
  const url = sbUrl(),
    key = sbKey();
  if (!url || !key) return null;
  try {
    const res = await fetch(`${url}/rest/v1/${path}`, {
      ...opts,
      headers: {
        "apikey": key,
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json",
        "Prefer": opts.prefer || "return=representation",
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      console.warn("SB", res.status, await res.text());
      return null;
    }
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  } catch (e) {
    console.warn("SB err", e);
    return null;
  }
}
async function loadFromSupabase(uid) {
  if (!sbUrl() || !sbKey() || !uid) return null;
  const rows = await sbFetch(`training_data?user_id=eq.${encodeURIComponent(uid)}&select=key,value`);
  if (!rows || !Array.isArray(rows)) return null;
  const r = {};
  for (const row of rows) {
    try {
      r[row.key] = JSON.parse(row.value);
    } catch {
      r[row.key] = row.value;
    }
  }
  return r;
}
async function saveToSupabase(uid, key, value) {
  if (!sbUrl() || !sbKey() || !uid) return;
  // on_conflict names the unique columns so PostgREST performs an UPSERT
  // (update the existing row) instead of failing on duplicate key. Without
  // this, the very first insert works but every later edit silently fails.
  await sbFetch(`training_data?on_conflict=user_id,key`, {
    method: "POST",
    prefer: "resolution=merge-duplicates,return=minimal",
    body: JSON.stringify({
      user_id: uid,
      key,
      value: JSON.stringify(value),
      updated_at: new Date().toISOString()
    })
  });
}

// ─── POLLEN (Oslo, via Open-Meteo Air Quality API — free, no key, CORS-ok) ────
const POLLEN_LEVELS = [
  { max: 0, label: "Ingen", color: "#94a3b8" },
  { max: 10, label: "Lavt", color: "#16a34a" },
  { max: 30, label: "Moderat", color: "#d97706" },
  { max: 100, label: "Høyt", color: "#dc2626" },
  { max: Infinity, label: "Svært høyt", color: "#7c3aed" }

function pollenLevel(v) {
  if (v == null) return POLLEN_LEVELS[0];
  return POLLEN_LEVELS.find(l => v <= l.max) || POLLEN_LEVELS[POLLEN_LEVELS.length - 1];
}
// Fetches today's pollen forecast for Oslo. Returns { birch, grass, alder,
// mugwort, worst: {type,value,level}, date } or null on failure.
async function fetchOsloPollen() {
  const url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=59.9139&longitude=10.7522&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen&timezone=Europe%2FOslo&forecast_days=1";
  const res = await fetch(url);
  if (!res.ok) throw new Error("Pollen-API feilet");
  const data = await res.json();
  const h = data.hourly;
  if (!h || !h.time) return null;
  // Average the daytime hours (08–20) for a representative daily value
  const dayIdx = h.time.map((t, i) => ({ t, i })).filter(x => {
    const hour = parseInt(x.t.slice(11, 13));
    return hour >= 8 && hour <= 20;
  }).map(x => x.i);
  const avg = (arr) => {
    const vals = dayIdx.map(i => arr?.[i]).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const types = [
    { key: "bjørk", value: avg(h.birch_pollen) },
    { key: "gress", value: avg(h.grass_pollen) },
    { key: "or", value: avg(h.alder_pollen) },
    { key: "burot", value: avg(h.mugwort_pollen) }
  ];
  const present = types.filter(t => t.value != null);
  const worst = present.length ? present.reduce((a, b) => b.value > a.value ? b : a) : null;
  return {
    date: h.time[0]?.slice(0, 10),
    types: present,
    worst: worst ? { type: worst.key, value: worst.value, level: pollenLevel(worst.value) } : null
  };
}

// Simplified physics model: P = (Froll + Fgrav + Faero) * v
function calcBikeWatts(km, min, elevM, weightKg) {
  if (!km || !min || parseFloat(km) === 0 || parseFloat(min) === 0) return null;

// ─── ICS CALENDAR EXPORT ────────────────────────────────────────────────────
function icsEscape(s) {
  return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");

  return dateStr.replace(/-/g, "");
}
function generateICS(prefs, goals, profile, plannedSessions, daysAhead) {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Treningsdagbok//NO", "CALSCALE:GREGORIAN"];
  const start = todayStr();
  for (let i = 0; i < daysAhead; i++) {
    const date = addDays(start, i);
    const plans = getPlannedSessionsForDate(prefs, goals, profile, plannedSessions, date);
    plans.forEach((p, idx) => {
      if (!p.type || p.type === "rest") return;
      const dateNoD = icsDate(date);
      const uid = `${dateNoD}-${idx}-${p.type}@treningsdagbok`;
      lines.push("BEGIN:VEVENT");
      lines.push(`UID:${uid}`);
      lines.push(`DTSTAMP:${dateNoD}T000000Z`);
      lines.push(`DTSTART;VALUE=DATE:${dateNoD}`);
      lines.push(`SUMMARY:${icsEscape(p.label.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF]/gu, "").trim())}`);
      lines.push(`DESCRIPTION:${icsEscape(p.desc)}`);
      lines.push("END:VEVENT");
    });
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

  const ics = generateICS(prefs, goals, profile, plannedSessions, daysAhead);

    type: "text/calendar;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;

function useStore(key, init) {
  const [val, setValRaw] = React.useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch {
      return init;
    }
  });
  const pendRef = React.useRef(null);
  const setVal = React.useCallback((v, uid) => {
    setValRaw(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try {
        localStorage.setItem(key, JSON.stringify(next));
      } catch {}
      if (uid) {
        clearTimeout(pendRef.current);
        pendRef.current = setTimeout(() => saveToSupabase(uid, key, next), 1500);
      }
      return next;
    });
  }, [key]);
  return [val, setVal];
}

function findProgramRaceDayOffset(prog, progKey) {
  // Scans a program's weeks for the "LØPSDAG" session and returns how many
  // days after week-1's Monday it actually falls (accounting for any
  // per-program day-shift, like bakken_100days).
  for (let weekIdx = 0; weekIdx < prog.weeks.length; weekIdx++) {
    const week = prog.weeks[weekIdx];
    for (const rawDowKey of Object.keys(week)) {
      const sessions = week[rawDowKey];
      if (sessions && sessions.some(s => s.label && s.label.includes("LØPSDAG"))) {
        let displayDow = parseInt(rawDowKey, 10);
        if (progKey === "bakken_100days") {
          displayDow = (displayDow - 1 + 7) % 7; // inverse of the +1 shift used for lookup
        }
        const dayOffsetInWeek = displayDow === 0 ? 6 : displayDow - 1; // Monday=0..Sunday=6
        return weekIdx * 7 + dayOffsetInWeek;
      }
    }
  }
  return null;
}

function programStartFromEndDate(progKey, endDate) {
  const prog = PROGRAMS[progKey];
  if (!prog || !endDate) return null;
  const offset = findProgramRaceDayOffset(prog, progKey);
  if (offset == null) return null;
  const raceD = new Date(endDate + "T00:00:00");
  raceD.setDate(raceD.getDate() - offset);
  return `${raceD.getFullYear()}-${String(raceD.getMonth() + 1).padStart(2, "0")}-${String(raceD.getDate()).padStart(2, "0")}`;
}

function getProgramSessionFromProg(prog, progKey, startDate, dateStr) {
  if (!prog || prog.isAuto || !startDate || !dateStr) return null;
  const startD = dow(startDate);
  const mondayOffset = startD === 0 ? -6 : 1 - startD;
  const startMonday = addDays(startDate, mondayOffset);
  const daysDiff = Math.round((new Date(dateStr + "T00:00:00") - new Date(startMonday + "T00:00:00")) / 86400000);
  if (daysDiff < 0) return null;
  const weekIdx = Math.floor(daysDiff / 7);
  if (weekIdx >= prog.weeks.length) return null;
  const weekPlan = prog.weeks[weekIdx];
  let lookupDow = dow(dateStr);
  if (progKey === "bakken_100days") {
    lookupDow = (lookupDow + 1) % 7;
  }
  return weekPlan[lookupDow] || [];
}

function getProgramSession(progKey, startDate, dateStr) {
  return getProgramSessionFromProg(PROGRAMS[progKey], progKey, startDate, dateStr);
}

function getEffectiveProgramDates(prefs) {
  const prog = PROGRAMS[prefs?.program];
  if (!prog) return { start: null, end: null };
  if (prefs?.programDateMode === "end" && prefs?.programEndDate) {
    const start = programStartFromEndDate(prefs.program, prefs.programEndDate);
    return { start, end: prefs.programEndDate };
  }
  if (prefs?.programStartDate) {
    const d0 = dow(prefs.programStartDate);
    const mondayOffset = d0 === 0 ? -6 : 1 - d0;
    const startMonday = addDays(prefs.programStartDate, mondayOffset);
    const offset = findProgramRaceDayOffset(prog, prefs.program);
    const end = offset != null ? addDays(startMonday, offset) : null;
    return { start: startMonday, end };
  }
  return { start: null, end: null };
}

function findWeekIndexWithLabel(weeks, needle) {
  for (let i = 0; i < weeks.length; i++) {
    const week = weeks[i];
    for (const k of Object.keys(week)) {
      if ((week[k] || []).some(s => s.label && s.label.includes(needle))) return i;
    }
  }
  return null;
}

// Adapts the bakken_100days plan around an intermediate goal race (e.g. a half
// marathon before the marathon). It reuses the plan's built-in "Testløp
// Halvmaraton" slot (normally 4 weeks before race day) and, if the real
// calendar gap between the goal race and the final race differs from 4 weeks,
// inserts or removes buffer weeks right before the final taper week so the
// calendar lines up — the same technique used in the hand-adjusted plan.
function alignBakkenRaceDay(weeks, endDate) {
  // Moves the LØPSDAG session within its week to the raw day-key matching
  // endDate's real weekday (a real race has a fixed weekday, e.g. Sunday,
  // which may differ from the program's built-in Saturday slot).
  if (!endDate) return weeks;
  const raceWeekIdx = findWeekIndexWithLabel(weeks, "LØPSDAG");
  if (raceWeekIdx == null) return weeks;
  const newWeeks = weeks.map((w, i) => i === raceWeekIdx ? { ...w } : w);
  const weekObj = newWeeks[raceWeekIdx];
  let raceSession = null;
  for (const k of Object.keys(weekObj)) {
    const found = (weekObj[k] || []).find(s => s.label && s.label.includes("LØPSDAG"));
    if (found) { raceSession = found; weekObj[k] = weekObj[k].filter(s => s !== found); }
  }
  if (raceSession) {
    const targetDow = dow(endDate);
    const rawKey = String((targetDow + 1) % 7);
    weekObj[rawKey] = [...(weekObj[rawKey] || []), raceSession];
  }
  return newWeeks;
}

function buildAdjustedBakkenPlan(midGoal, endDate, baseWeeks) {
  const baseProg = PROGRAMS.bakken_100days;
  const sourceWeeks = baseWeeks || baseProg.weeks;
  if (!midGoal || !midGoal.date || !endDate) return { ...baseProg, weeks: sourceWeeks };
  const testWeekIdx = findWeekIndexWithLabel(sourceWeeks, "Testløp Halvmaraton");
  const raceWeekIdx = findWeekIndexWithLabel(sourceWeeks, "LØPSDAG");
  if (testWeekIdx == null || raceWeekIdx == null) return { ...baseProg, weeks: sourceWeeks };

  const normalGapWeeks = raceWeekIdx - testWeekIdx;
  const daysBetween = Math.round((new Date(endDate + "T00:00:00") - new Date(midGoal.date + "T00:00:00")) / 86400000);
  const actualGapWeeks = Math.round(daysBetween / 7);
  const diff = actualGapWeeks - normalGapWeeks;

  let weeks = sourceWeeks.map(w => ({ ...w }));
  let adjustedTestWeekIdx = testWeekIdx;

  if (diff > 0) {
    // Insert `diff` easy buffer weeks (clone of the week right before the
    // final taper) so the extra calendar weeks are absorbed without touching
    // the fixed taper structure closest to race day.
    const template = { ...weeks[raceWeekIdx - 1] };
    for (let i = 0; i < diff; i++) weeks.splice(raceWeekIdx, 0, template);
  } else if (diff < 0) {
    // Trim by removing the optional "Uke 3 (ekstra)" week if it exists before
    // the test week — the plan's only built-in flexibility point.
    const removableIdx = findWeekIndexWithLabel(baseProg.weeks, "UKE_3_EKSTRA_MARKER"); // not present; fall back below
    const idx3ekstra = 5; // index of "Uke 3 (ekstra)" in bakken_100days
    if (idx3ekstra < testWeekIdx) {
      weeks.splice(idx3ekstra, Math.min(-diff, 1));
      adjustedTestWeekIdx = testWeekIdx - 1;
    }
  }

  // Replace the generic testløp session with the actual goal's details, AND
  // move it to the raw day-key that matches the goal's real weekday (a real
  // race has a fixed weekday, e.g. Sunday, which may differ from the
  // program's built-in testløp slot).
  const weekObj = { ...weeks[adjustedTestWeekIdx] };
  let movedSession = null;
  for (const k of Object.keys(weekObj)) {
    const found = (weekObj[k] || []).find(s => s.label && s.label.includes("Testløp Halvmaraton"));
    if (found) {
      movedSession = { ...found, label: `🏆 ${midGoal.name}`, desc: `${midGoal.name}${midGoal.date ? " – " + formatDateShort(midGoal.date) : ""}. Mål: ${midGoal.targetTime || "personlig rekord"}.` };
      weekObj[k] = weekObj[k].filter(s => s !== found); // remove from old slot
    }
  }
  if (movedSession) {
    const goalDow = dow(midGoal.date);
    const rawKey = String((goalDow + 1) % 7); // inverse of bakken_100days display shift
    weekObj[rawKey] = [...(weekObj[rawKey] || []), movedSession];
  }
  weeks[adjustedTestWeekIdx] = weekObj;

  return { ...baseProg, weeks };
}

function getPlannedSessionsForDate(prefs, goals, profile, plannedSessions, dateStr) {
  if (plannedSessions[dateStr] !== undefined) return plannedSessions[dateStr];
  const progKey = prefs?.program || "auto";
  if (progKey !== "auto") {
    let prog = PROGRAMS[progKey];

    // Determine the race day (end date) regardless of which mode the user picked,
    // using the BASE program first (needed before we know if an adjustment applies).
    let endDate = null;
    if (prefs?.programDateMode === "end" && prefs?.programEndDate) {
      endDate = prefs.programEndDate;
    } else if (prefs?.programStartDate) {
      const d0 = dow(prefs.programStartDate);
      const mondayOffset0 = d0 === 0 ? -6 : 1 - d0;
      const startMonday0 = addDays(prefs.programStartDate, mondayOffset0);
      const offset0 = findProgramRaceDayOffset(prog, progKey);
      endDate = offset0 != null ? addDays(startMonday0, offset0) : null;
    }

    // If a mid-goal race is set, build the adjusted plan (may insert/remove weeks).
    // First align the base plan's race day to the real weekday of endDate
    // (races have a fixed real-world weekday, e.g. Sunday), then layer the
    // mid-goal adjustment on top of that aligned base.
    if (progKey === "bakken_100days" && endDate) {
      const alignedWeeks = alignBakkenRaceDay(PROGRAMS.bakken_100days.weeks, endDate);
      if (prefs?.midGoalId) {
        const midGoal = goals.find(g => String(g.id) === String(prefs.midGoalId));
        prog = midGoal ? buildAdjustedBakkenPlan(midGoal, endDate, alignedWeeks) : { ...PROGRAMS.bakken_100days, weeks: alignedWeeks };
      } else {
        prog = { ...PROGRAMS.bakken_100days, weeks: alignedWeeks };
      }
    }

    // Always derive the effective start date FROM the race day using the
    // (possibly adjusted) program's own race-day offset. This way, inserting
    // a buffer week automatically pushes the whole plan's start a week
    // earlier — keeping the race day fixed at what the user specified,
    // instead of letting it drift later.
    let effectiveStart = prefs?.programStartDate;
    if (endDate) {
      const offset = findProgramRaceDayOffset(prog, progKey);
      if (offset != null) effectiveStart = addDays(endDate, -offset);
    }

    const result = getProgramSessionFromProg(prog, progKey, effectiveStart, dateStr);
    if (result !== null) return result;
  }
  return getGoalSuggestions(goals, profile, prefs, dateStr);
}

function parseTargetPace(goal) {
  if (!goal.targetTime || !goal.distanceKm) return null;
  const p = goal.targetTime.split(":").map(Number);
  const m = p.length === 3 ? p[0] * 60 + p[1] + p[2] / 60 : p[0] + p[1] / 60;
  return m / parseFloat(goal.distanceKm);
}

// Effort/pace zones anchored to MARATHON goal pace, using the ratios from the
// 3:45-plan Word doc (Marius Bakken calculator). Sone 3 sits between marathon
// and half-marathon pace; Sone 4-5 are threshold/speed. Given a marathon goal
// pace (min/km), returns the 5 zones with pace + HR range. Works for any goal —
// e.g. change the marathon target and every zone scales with it.
// Reference (3:45 marathon = 5:20/km maratonfart, MHR 194):
//   Sone 1 6:21 (1.191×)  Sone 2 5:46 (1.081×)  Sone 3 5:11 (0.972×)
//   Sone 4 4:54 (0.919×)  Sone 5 4:42 (0.881×)
const ZONE_RATIOS = [
  { zone: 1, ratio: 1.1908, name: "Veldig lett", hrPct: [0.60, 0.72] },
  { zone: 2, ratio: 1.0814, name: "Lett", hrPct: [0.72, 0.80] },
  { zone: 3, ratio: 0.9720, name: "Moderat (maraton–HM)", hrPct: [0.80, 0.87] },
  { zone: 4, ratio: 0.9189, name: "Hardt (10k–HM)", hrPct: [0.87, 0.92] },
  { zone: 5, ratio: 0.8814, name: "Veldig hardt", hrPct: [0.92, 0.97] }
];
function paceZonesFromMarathon(maratonPaceMinKm, maxHr) {
  if (!maratonPaceMinKm) return null;
  return ZONE_RATIOS.map(z => ({
    zone: z.zone,
    name: z.name,
    pace: fmtPace(maratonPaceMinKm * z.ratio),
    hr: maxHr ? [Math.round(maxHr * z.hrPct[0]), Math.round(maxHr * z.hrPct[1])] : null
  }));
}
// Given the user's goals, derive the marathon-equivalent pace to anchor zones.
// Prefer an actual marathon goal; otherwise scale from whatever goal exists
// using race-distance pace relationships (HM ~2.6% faster than M pace, etc.).
function deriveMarathonPace(goals) {
  if (!goals || !goals.length) return null;
  const withPace = goals.map(g => ({ g, pace: parseTargetPace(g), km: parseFloat(g.distanceKm) })).filter(x => x.pace);
  if (!withPace.length) return null;
  const mar = withPace.find(x => x.km >= 40);
  if (mar) return mar.pace;
  const hm = withPace.find(x => x.km >= 20 && x.km < 40);
  if (hm) return hm.pace / 0.974; // HM pace ≈ 2.6% faster than marathon pace
  const tenk = withPace.find(x => x.km >= 9 && x.km < 12);
  if (tenk) return tenk.pace / 0.945;
  const fivek = withPace.find(x => x.km >= 4 && x.km < 6);
  if (fivek) return fivek.pace / 0.92;
  return withPace[0].pace; // fallback
}

function dagsformVerdict(feel, hr, hrv, sleep, profile) {

  let score = f;
  const notes = [];
  if (hrv) {

    if (d < -15) { score -= 1; notes.push("HRV under norm"); }
    else if (d > 15) { score += 0.5; notes.push("HRV over norm"); }
  }
  if (hr) {
    const d = parseFloat(hr) - normHr;
    if (d > 7) { score -= 1; notes.push("forhøyet hvilepuls"); }
    else if (d < -5) { score += 0.25; notes.push("lav hvilepuls"); }
  }
  if (sleep) {
    const s = parseFloat(sleep);
    if (s < 6) { score -= 0.5; notes.push("lite søvn"); }
    else if (s >= 8) { score += 0.25; notes.push("god søvn"); }
